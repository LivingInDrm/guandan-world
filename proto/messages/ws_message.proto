syntax = "proto3";

package guandan.messages;
option go_package = "guandan-world/proto/gen/go/messages";

import "messages/game_event.proto";

// WSMessage 表示 WebSocket 消息
// 用于客户端和服务端之间的通信
message WSMessage {
  string type = 1;                // 消息类型 (用于快速路由和日志，应与 payload 类型对应)
                                  // - "game_event" → payload = game_event
                                  // - "error" → payload = error
                                  // - "join_room", "play_cards" 等客户端请求 → payload = request
                                  // - "room_update", "player_view" 等服务端响应 → payload = response
  int64 timestamp_ms = 2;         // 消息时间戳 (毫秒)
  string player_id = 3;           // 玩家ID (可选)
  
  // 消息载荷 (payload 类型应与 type 字段对应)
  oneof payload {
    GameEvent game_event = 10;    // 游戏事件 (type="game_event")
    WSRequest request = 11;       // 客户端请求 (type="join_room", "play_cards" 等)
    WSResponse response = 12;     // 服务端响应 (type="room_update", "player_view" 等)
    ErrorInfo error = 13;         // 错误信息 (type="error")
  }
}

// WSRequest 表示客户端请求
// 用于封装客户端发送的各种请求
message WSRequest {
  string request_id = 1;          // 请求ID (可选，用于追踪)
  bytes data = 2;                 // 请求数据 (JSON 或其他格式的序列化数据)
}

// WSResponse 表示服务端响应
// 用于封装服务端对客户端请求的响应
message WSResponse {
  string request_id = 1;          // 请求ID (可选，关联的请求)
  bool success = 2;               // 是否成功
  bytes data = 3;                 // 响应数据 (JSON 或其他格式的序列化数据)
}

// ErrorInfo 表示错误信息
// 用于标准化错误通知
message ErrorInfo {
  string code = 1;                // 错误码 (如 "INVALID_REQUEST", "ROOM_FULL")
  string message = 2;             // 错误消息 (人类可读的错误描述)
  map<string, string> details = 3; // 额外的错误详情 (如 "original_type", "field" 等)
}
