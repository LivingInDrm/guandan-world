syntax = "proto3";

package guandan.action;

import "common.proto";

option go_package = "guandan-world/proto/action";

// CompType 牌型类型枚举
enum CompType {
  COMP_TYPE_UNSPECIFIED = 0;
  COMP_TYPE_FOLD = 1;          // 弃牌/过牌
  COMP_TYPE_ILLEGAL = 2;       // 非法牌型
  COMP_TYPE_SINGLE = 3;        // 单张
  COMP_TYPE_PAIR = 4;          // 对子
  COMP_TYPE_TRIPLE = 5;        // 三张
  COMP_TYPE_FULL_HOUSE = 6;    // 葫芦 (3+2)
  COMP_TYPE_STRAIGHT = 7;      // 顺子
  COMP_TYPE_PLATE = 8;         // 钢板 (连对)
  COMP_TYPE_TUBE = 9;          // 钢管 (三连)
  COMP_TYPE_JOKER_BOMB = 10;   // 王炸
  COMP_TYPE_NAIVE_BOMB = 11;   // 普通炸弹 (4+张同牌)
  COMP_TYPE_STRAIGHT_FLUSH = 12; // 同花顺
}

// CardComp 牌型组合
// 注意: 仅包含序列化必需字段，不包含 SDK 内部计算字段
message CardComp {
  // 牌型类型
  CompType comp_type = 1;
  
  // 是否有效（用于客户端验证）
  bool is_valid = 2;
  
  // 牌组中的牌（原始牌，包含逢人配）
  // 注意：PlayAction 中已包含 cards，此处可选择性包含
  // 推荐策略：PlayAction.cards 为主，CardComp.cards 可省略以减少传输
  // repeated guandan.common.Card cards = 3; // OPTIONAL，可省略
}

// PlayAction 玩家出牌动作
message PlayAction {
  // 玩家座位号 (0-3)
  int32 player_seat = 1;
  
  // 出的牌（空表示过牌）
  repeated guandan.common.Card cards = 2;
  
  // 牌型组合（仅在非过牌时有值）
  optional CardComp comp = 3;
  
  // 时间戳（Unix 毫秒）
  int64 timestamp_ms = 4;
  
  // 是否为过牌
  bool is_pass = 5;
}
